name: Spring Boot CI/CD to AWS ECS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: eu-central-1          # z. B. Frankfurt
  ECR_REPOSITORY: freemomentrepo    # Name deines ECR-Repos
  ECS_CLUSTER: freemomentCluster
  ECS_SERVICE: freemomentService

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

