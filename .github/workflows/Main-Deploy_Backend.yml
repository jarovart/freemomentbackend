name: Deploy Spring Boot to Strato (Main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HOST: ${{ secrets.STRATO_HOST }}
  PORT: ${{ secrets.STRATO_PORT }}
  USERNAME: ${{ secrets.STRATO_USER }}
  SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Casttime4meEnvironments

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: dev
          JWT_SECRET: test_secret_1234567890123456789012345678901234567890
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test-password

      - name: Clean deploy folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          port: ${{ env.PORT }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_KEY }}
          script: |
            rm -f ${{ vars.APP_PATH }}/deploy/target/*.jar
        
      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Show target folder
        run: |
          echo "=== TARGET ==="
          ls -lah target

      - name: Upload jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          port: ${{ env.PORT }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_KEY }}
          source: target/*.jar
          target: ${{ vars.APP_PATH }}/deploy
          
          
      - name: Restart application on Strato
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          port: ${{ env.PORT }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e
            APP_PATH="${{ vars.APP_PATH }}"
            SERVICE_NAME="${{ vars.SERVICE_NAME }}"
      
            JAR=$(ls -t "$APP_PATH/deploy/target/"*.jar | head -n 1)
            
            echo "Using JAR: $JAR"
            cp "$JAR" "$APP_PATH/app.jar"
      
            sudo systemctl restart "$SERVICE_NAME"
            sleep 10
            sudo systemctl status "$SERVICE_NAME" --no-pager

      - name: Wait for application
        run: |
          sleep 10
          curl --fail https://freemoment.de/api/info/status
