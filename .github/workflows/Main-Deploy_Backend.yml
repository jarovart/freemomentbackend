name: Deploy Spring Boot to Strato (Main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HOST: ${{ secrets.STRATO_HOST }}
  PORT: ${{ secrets.STRATO_PORT }}
  USERNAME: ${{ secrets.STRATO_USER }}
  SSH_KEY: ${{ secrets.STRATO_SSH_KEY }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME }}
  MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Casttime4meEnvironments

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: dev
          JWT_SECRET: test_secret_1234567890123456789012345678901234567890
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test-password

      - name: Clean deploy folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          port: ${{ env.PORT }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_KEY }}
          script: |
            rm -f ${{ vars.APP_PATH }}/deploy/target/*.jar
        
      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Show target folder
        run: |
          echo "=== TARGET ==="
          ls -lah target

      - name: Upload jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          port: ${{ env.PORT }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_KEY }}
          source: target/*.jar
          target: ${{ vars.APP_PATH }}/deploy
          
          
      - name: Deploy with automatic rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST }}
          port: ${{ env.PORT }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -e
      
            APP_PATH="${{ vars.APP_PATH }}"
            SERVICE_NAME="${{ vars.SERVICE_NAME }}"
            HEALTH_URL="${{ secrets.HEALTH_URL_MAIN }}"
      
            PREVIOUS_RELEASE=""
            if [ -L "$APP_PATH/current" ]; then
              PREVIOUS_RELEASE=$(readlink -f "$APP_PATH/current")
              echo "Previous release: $PREVIOUS_RELEASE"
            fi
      
            RELEASE_ID=$(date +"%Y%m%d-%H%M%S")
            RELEASE_DIR="$APP_PATH/releases/$RELEASE_ID"
            mkdir -p "$RELEASE_DIR"
      
            JAR=$(ls -t "$APP_PATH/deploy/target/"*.jar | head -n 1)
            echo "Using JAR: $JAR"
      
            cp "$JAR" "$RELEASE_DIR/app.jar"
            ln -sfn "$RELEASE_DIR" "$APP_PATH/current"
      
            sudo systemctl restart "$SERVICE_NAME"
            sleep 15
      
            if curl -fsS "$HEALTH_URL" > /dev/null; then
              echo "Health check passed."
            else
              echo "Health check failed. Rolling back..."
      
              if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                ln -sfn "$PREVIOUS_RELEASE" "$APP_PATH/current"
                sudo systemctl restart "$SERVICE_NAME"
                sleep 10
      
                if curl -fsS "$HEALTH_URL" > /dev/null; then
                  echo "Rollback successful."
                else
                  echo "Rollback failed. Manual check required."
                fi
              else
                echo "No previous release found. Cannot rollback."
              fi
      
              exit 1
            fi
      
            find "$APP_PATH/releases" -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
